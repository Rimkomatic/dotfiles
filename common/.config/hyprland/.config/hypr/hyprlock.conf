source = colors.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/anime-girl-white-hair-4k-wallpaper-uhdpaper.com-327@5@i.jpg   # only png supported for now
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = $on_primary
    inner_color = $on_surface
    font_color = $surface
    fade_on_empty = false
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i> Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 40 # -1 means complete rounding (circle/oval)
    check_color = $primary
    fail_color = $error # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    
    # MODIFIED: Pushed further down the screen (was -20)
    position = 0, -250 
    
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = $shadow
    shadow_boost = 1.6
}

label {
    monitor =
    #clock
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = $on_surface
    font_size = 55
    font_family = Fira Semibold
    position = -100, 70
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = $USER
    color = $on_surface
    font_size = 20
    font_family = Fira Semibold
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    # Queries playerctl for Spotify metadata, with a fallback if nothing is playing
    text = cmd[update:1000] echo "$(playerctl -p spotify metadata --format '{{title}} - {{artist}}' 2>/dev/null || echo 'No Media Playing')"
    color = $on_surface
    font_size = 14
    font_family = Fira Semibold
    
    # Adjust alignment and positioning so it floats cleanly somewhere on screen
    position = 0, -150
    halign = center
    valign = center
    
    shadow_passes = 5
    shadow_size = 10
}
